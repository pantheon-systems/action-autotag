name: Autotag and Release Action
description: Automatically create tags and releases for your project.
author: pantheon-systems
branding:
  icon: tag
  color: yellow
inputs:
  push-tag:
    description: 'Push the tag to the origin repository'
    required: false
    default: true
  push-major-version-branch:
    description: 'Push to a branch matching the major version number on the origin repository'
    required: false
    default: false
  v-prefix:
    description: "Whether to prefix the tag with the letter 'v'."
    required: false
    default: true
  create-release:
    description: "Whether to create a release from the tag or not. 'true', 'false', 'draft'."
    required: false
    default: true
  scheme:
    description: "Commit message scheme autotag uses to determine the version bump. '' (autotag's default), 'autotag', or 'conventional'."
    required: false
    default: ''
  workdir:
    description: 'Directory with the code to tag'
    required: false
    default: '.'

outputs:
  tag:
    description: 'The tag that was created'
    value: ${{ steps.tag.outputs.VERSION_TAG }}
runs:
  using: composite
  steps:
    - id: tag
      name: Tag
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        AUTOTAG_VERSION: v1.4.3
        AUTOTAG_SHA256: 85e7ec97d732800bb838085fd3f2e19b2aa2ee3a8da0db7fd0aaf4113a279f3a
        V_PREFIX: ${{ inputs.v-prefix }}
        SCHEME: ${{ inputs.scheme }}
      run: |
        set -euo pipefail

        if ! command -v autotag &>/dev/null; then
          curl -fsSLo /usr/local/bin/autotag \
            "https://github.com/autotag-dev/autotag/releases/download/${AUTOTAG_VERSION}/autotag_linux_amd64"
          echo "${AUTOTAG_SHA256}  /usr/local/bin/autotag" | sha256sum -c -
          chmod +x /usr/local/bin/autotag
        fi

        # autotag prints a bare version but creates a tag that is prefixed
        # unless -e is passed, so build-args.sh keeps that flag in step with
        # TAG_PREFIX. Otherwise the tag created and the tag pushed disagree.
        TAG_PREFIX=""
        if [[ "$V_PREFIX" == 'true' ]]; then
          TAG_PREFIX="v"
        fi

        RAW_ARGUMENTS="$("${GITHUB_ACTION_PATH}/scripts/build-args.sh" "$SCHEME" "$V_PREFIX")"

        AUTOTAG_ARGUMENTS=()
        while IFS= read -r arg; do
          if [[ -n "$arg" ]]; then
            AUTOTAG_ARGUMENTS+=("$arg")
          fi
        done <<< "$RAW_ARGUMENTS"

        NEW_VERSION_TAG="${TAG_PREFIX}$(autotag ${AUTOTAG_ARGUMENTS[@]+"${AUTOTAG_ARGUMENTS[@]}"})"
        echo "VERSION_TAG=${NEW_VERSION_TAG}" >> "$GITHUB_OUTPUT"
    - id: push-tag
      name: Push Tag
      if: ${{ inputs.push-tag == 'true' }}
      working-directory: ${{ inputs.workdir }}
      shell: bash
      env:
        VERSION_TAG: ${{ steps.tag.outputs.VERSION_TAG }}
      run: git push origin "$VERSION_TAG"
    - id: push-major-version-branch
      if: ${{ inputs.push-major-version-branch == 'true' }}
      working-directory: ${{ inputs.workdir }}
      shell: bash
      env:
        VERSION_TAG: ${{ steps.tag.outputs.VERSION_TAG }}
      run: |
        MAJOR_VERSION_BRANCH="v${VERSION_TAG#v}"
        MAJOR_VERSION_BRANCH="${MAJOR_VERSION_BRANCH%%.*}"
        echo "Major version: ${MAJOR_VERSION_BRANCH}"
        
        # if checked out with 'fetch-depth: 0', this will fail. Consider adjusting for v1.
        git fetch --prune --unshallow --all || true
        
        if git show-ref --verify --quiet "refs/heads/${MAJOR_VERSION_BRANCH}"; then
          git checkout "${MAJOR_VERSION_BRANCH}"
          git merge --ff-only main
        else
          git checkout -b "${MAJOR_VERSION_BRANCH}"
        fi

        git push origin "${MAJOR_VERSION_BRANCH}"
    - id: release
      name: Create Release
      if: ${{ inputs.create-release != 'false' }}
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION_TAG: ${{ steps.tag.outputs.VERSION_TAG }}
        CREATE_RELEASE: ${{ inputs.create-release }}
      run: |
        DRAFT_FLAG=()
        case "$CREATE_RELEASE" in
          true) ;;
          draft) DRAFT_FLAG+=(--draft) ;;
          *)
            echo "::error::Invalid value for create-release: '$CREATE_RELEASE' (expected 'true', 'false', or 'draft')"
            exit 1
            ;;
        esac
        gh release create "$VERSION_TAG" \
          -t "$VERSION_TAG" \
          --generate-notes \
          "${DRAFT_FLAG[@]}"
