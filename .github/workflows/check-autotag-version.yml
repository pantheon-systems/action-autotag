name: Check autotag version

on:
  schedule:
    - cron: '17 14 * * 1' # Weekly on Monday
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pantheon-systems/action-package-updater@e3a0ba1dce60b999590421a336e0de01aaadde15 # v1.1.21
        with:
          dependencies-yml: dependencies.yml
